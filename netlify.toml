[build]
  command = "npm run build"
  publish = "out"
  ignore = "node ./scripts/netlify-weekly-ignore.mjs"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "https://dfmoa.com/*"
  to = "https://www.dfmoa.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://dfmoa.netlify.app/*"
  to = "https://www.dfmoa.com/:splat"
  status = 301
  force = true
